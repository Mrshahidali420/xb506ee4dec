name: Build video
run-name: Build ${{ inputs.job }}

# Start with: gh workflow run build.yml -f job=jobs/<name>
# autopilot.yml calls it too (workflow_call). An auto-* job has meta.json and no script.json:
# the script is written here (tools/autopilot/write_script.py) and committed back to the repo.
# A job folder holds script.json + source.json. Videos are never committed:
# the source is fetched here, and the result is a 1-day artifact.
on:
  workflow_dispatch:
    inputs:
      job:
        description: Job folder, e.g. jobs/death-note-e1
        required: true
      script:
        description: Script file(s) inside the job folder, space separated, built in order
        default: script.json
      queue:
        description: Page to queue the videos for (e.g. spoiler); empty = artifact only
        default: ''
      ref:
        description: Branch to check out (autopilot passes its branch, so the job folder it just pushed is there)
        default: ''
  workflow_call:
    inputs:
      job:
        type: string
        required: true
      script:
        type: string
        default: script.json
      queue:
        type: string
        default: ''
      ref:
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330  # a whole-story build (70+ chapters) needs hours; GitHub's cap is 360
    permissions:
      contents: write   # the written script.json of an autopilot job is committed back
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Fetch private assets (music)
        env:
          ASSETS_KEY: ${{ secrets.ASSETS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$ASSETS_KEY" > ~/.ssh/assets && chmod 600 ~/.ssh/assets
          GIT_SSH_COMMAND="ssh -i ~/.ssh/assets -o StrictHostKeyChecking=accept-new" \
            git clone --depth 1 git@github.com:${{ github.repository_owner }}/recap-assets.git assets
          ln -s assets/music music

      # The film or panel video is kept between runs, so only the first build of a job downloads it.
      # Restored before WARP: through the tunnel the cache download crawls (6+ min instead of 20 s).
      # Restore here, save right after the download (below): actions/cache alone saves only when the WHOLE job
      # succeeds, so a failed or timed-out build threw its download away and the restart fetched everything again.
      - name: Restore cached source
        id: cache
        uses: actions/cache/restore@v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 3
        with:
          path: |
            ${{ inputs.job }}/source.mp4
            ${{ inputs.job }}/work
          key: src-${{ inputs.job }}-${{ hashFiles(format('{0}/source.json', inputs.job)) }}

      - name: Read the source type
        id: src
        run: echo "type=$(jq -r .type '${{ inputs.job }}/source.json')" >> "$GITHUB_OUTPUT"

      # WARP is only needed to download a video source the cache did not have. Manga pages come without it:
      # a manga download through the tunnel twice cut the runner off from GitHub ("lost communication").
      - name: Route traffic through Cloudflare WARP
        if: steps.cache.outputs.cache-hit != 'true' && steps.src.outputs.type != 'manga' && steps.src.outputs.type != 'webtoon'
        timeout-minutes: 5
        uses: ./.github/actions/warp

      # Every speech model the build may use, downloaded once on a cache miss (step "Download speech models" below)
      # and kept here. Paths are the real on-disk ones the probe printed on the runner.
      - name: Restore speech models
        id: speech
        uses: actions/cache@v4
        with:
          path: |
            voice-test/models
            ~/.cache/huggingface
          key: speech-models-v2

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q uv kisskh-downloader playwright && python -m playwright install --with-deps chromium > /dev/null
          mkdir -p ~/.config/watch
          printf 'GROQ_API_KEY=%s\nHF_TOKEN=%s\n' "${{ secrets.GROQ_API_KEY }}" "${{ secrets.HF_TOKEN }}" > ~/.config/watch/.env

      - name: Fetch source
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        # manga: a 12 GB address-space cap PER PROCESS (not a total), so one runaway process fails with a readable MemoryError
        # instead of starving the runner until GitHub loses it, which leaves no log at all.
        # Not for video sources: Chromium (kisskh keys) reserves far more address space than it uses.
        run: |
          free -m | head -2; df -h . | tail -1
          case "${{ steps.src.outputs.type }}" in manga|webtoon) ulimit -v 12000000 ;; esac
          python3 tools/fetch_source.py "${{ inputs.job }}"

      # Saved the moment the download is whole (never partial: this step only runs when the fetch succeeded)
      - name: Keep the downloaded source
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ inputs.job }}/source.mp4
            ${{ inputs.job }}/work
          key: src-${{ inputs.job }}-${{ hashFiles(format('{0}/source.json', inputs.job)) }}

      # WARP is only for the download; the free edge voice service blocks its shared addresses
      - name: Leave WARP
        run: warp-cli --accept-tos disconnect || true

      - name: Write the script (autopilot jobs)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          job="${{ inputs.job }}"
          if [ -f "$job/meta.json" ] && [ ! -f "$job/script.json" ]; then
            python3 tools/autopilot/write_script.py "$job"
            git config user.name "queue bot" && git config user.email "queue-bot@users.noreply.github.com"
            git add "$job/script.json" && git commit -qm "Script: $job"
            git pull -q --rebase && git push -q
          fi

      # DepthFlow (key manhwa panels, "depth": true in a script) lives in its own environment; only built when a script asks.
      # continue-on-error: with DEPTHFLOW_PY unset the depth segments fall back to normal clips.
      - name: Install DepthFlow
        continue-on-error: true
        run: |
          files=""; for s in ${{ inputs.script }}; do files="$files ${{ inputs.job }}/$s"; done
          grep -qs '"depth": *true' $files || { echo "no depth segments"; exit 0; }
          sudo apt-get install -y -qq xvfb libegl1 libgl1 libgl1-mesa-dri libglu1-mesa > /dev/null
          uv venv --python 3.11 ~/depthflow-venv
          uv pip install --python ~/depthflow-venv/bin/python --index-strategy unsafe-best-match             --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision depthflow==1.0.1 pillow numpy
          echo "DEPTHFLOW_PY=$HOME/depthflow-venv/bin/python" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"

      # The two optional speech extras share the Kokoro `uv run`: an install failure there would kill every build.
      # Probe them alone; the build adds them only when they install (build_short.py falls back when they are missing).
      - name: Probe speech extras
        id: extras
        run: |
          # the same package list as the Build step, so a clash between them shows here and not in every build
          if uv run --python 3.11 --with truststore --with groq --with soundfile --with edge-tts --with numpy --with kokoro-onnx --with supertonic==1.3.1 --with faster-whisper==1.2.1 --with gradio_client --with pillow python -c "import supertonic, faster_whisper; print('supertonic + faster-whisper import ok')"; then
            echo "with=--with supertonic==1.3.1 --with faster-whisper==1.2.1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::supertonic / faster-whisper did not install; building without them"
            echo "with=" >> "$GITHUB_OUTPUT"
          fi

      # On a cache miss: fetch every model once, then print where each really landed (new files over 1 MB), so the cache path list stays true.
      - name: Download speech models
        if: steps.speech.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 20  # a hung test render must not hold the whole job
        run: |
          touch /tmp/marker
          uv run --python 3.11 --with numpy --with soundfile --with kokoro-onnx ${{ steps.extras.outputs.with }} python tools/fetch_models.py
          if [ -n "$DEPTHFLOW_PY" ]; then
            "$DEPTHFLOW_PY" -c "from PIL import Image; Image.new('RGB', (256, 256), (90, 120, 160)).save('/tmp/probe.png')"
            xvfb-run -a "$DEPTHFLOW_PY" tools/depth_scene.py /tmp/probe.png /tmp/probe.mp4 1 10 270 480
          fi
          echo "== new model files =="
          find / -xdev -type f -size +1M -newer /tmp/marker             -not -path '/proc/*' -not -path '/sys/*' -not -path '/tmp/*' -not -path "$HOME/.cache/uv/*"             -not -path "$HOME/depthflow-venv/*" -not -path '/usr/*' -not -path '/var/*' 2>/dev/null | head -40
          ls -la voice-test/models ~/.cache 2>&1 | head -30

      - name: Build
        run: |
          for s in ${{ inputs.script }}; do
            [ -f "${{ inputs.job }}/$s" ] || { echo "no $s: prep run only"; continue; }
            uv run --python 3.11 --with truststore --with groq --with soundfile --with edge-tts --with numpy --with kokoro-onnx               ${{ steps.extras.outputs.with }} --with gradio_client --with pillow python tools/build_short.py "${{ inputs.job }}" "$s"
          done

      # A manhwa part also becomes a swipe-through picture post (tools/make_carousel.py). No panels = no carousel.
      - name: Make the carousel
        if: contains(inputs.script, 'script.json')
        continue-on-error: true
        run: |
          pip install -q pillow requests
          python3 tools/make_carousel.py "${{ inputs.job }}"

      - uses: actions/upload-artifact@v4
        with:
          name: carousel
          path: ${{ inputs.job }}/posts
          if-no-files-found: ignore
          retention-days: 1

      # Every finished video is kept for good in the private assets repo, one release per series
      # (jobs/kdrama-weak-hero-e03 -> release archive-kdrama-weak-hero, file e03-final_short.mp4),
      # so whole-series compilations can be cut later without rebuilding.
      - name: Archive the videos
        if: always()
        env:
          GH_TOKEN: ${{ secrets.ARCHIVE_TOKEN }}
        run: |
          ls "${{ inputs.job }}"/final_*.mp4 >/dev/null 2>&1 || exit 0
          [ -n "$GH_TOKEN" ] || { echo "no ARCHIVE_TOKEN, skipped"; exit 0; }
          name=$(basename "${{ inputs.job }}"); series=$(echo "$name" | sed -E 's/-e[0-9]+$//'); ep=$(echo "$name" | grep -oE 'e[0-9]+$' || true)
          repo="${{ github.repository_owner }}/recap-assets"; tag="archive-$series"
          gh release view "$tag" -R "$repo" >/dev/null 2>&1 || gh release create "$tag" -R "$repo" --title "$tag" --notes "Finished recap videos for $series."
          for f in "${{ inputs.job }}"/final_*.mp4; do
            cp "$f" "/tmp/${ep:+$ep-}$(basename "$f")"; gh release upload "$tag" "/tmp/${ep:+$ep-}$(basename "$f")" -R "$repo" --clobber
          done

      - uses: actions/upload-artifact@v4
        if: always()  # keep the parts that did build
        with:
          name: video
          path: ${{ inputs.job }}/final_*.mp4
          if-no-files-found: ignore
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: sheets
          path: |
            ${{ inputs.job }}/work/panels_sheet_*.jpg
            ${{ inputs.job }}/work/film_sheet_*.jpg
            ${{ inputs.job }}/work/shot_sheet_*.jpg
            ${{ inputs.job }}/work/english.txt
            ${{ inputs.job }}/work/shots.txt
            ${{ inputs.job }}/work/panels_text.json
          if-no-files-found: ignore
          retention-days: 1

  # Puts the built videos into the page's posting queue, in script order.
  # Shares the post workflow's lock, so the queue file never gets two writers.
  queue:
    needs: build
    if: inputs.queue != ''
    runs-on: ubuntu-latest
    concurrency:
      group: post-${{ inputs.queue }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: video
          path: ${{ inputs.job }}
      # Autopilot videos have no human check, so a broken build must not reach the page
      - name: Check the video length (autopilot jobs)
        if: startsWith(inputs.job, 'jobs/auto-')
        run: |
          which ffprobe >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null; }
          for s in ${{ inputs.script }}; do
            out=$(jq -r '.output // "final_short.mp4"' "${{ inputs.job }}/$s")
            len=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "${{ inputs.job }}/$out")
            echo "$out: ${len}s"
            awk -v l="$len" 'BEGIN { exit !(l >= 120 && l <= 540) }' || { echo "length outside 120-540 s, not queued"; exit 1; }
          done
      - uses: actions/download-artifact@v4
        continue-on-error: true  # no carousel for this job (no panels)
        with:
          name: carousel
          path: extra/${{ inputs.queue }}/${{ github.run_id }}
      - name: Add the carousel to the picture queue
        continue-on-error: true
        run: |
          d="extra/${{ inputs.queue }}/${{ github.run_id }}"
          [ -f "$d/post.json" ] || { echo "no carousel"; exit 0; }
          pip install -q requests truststore
          name=$(basename "${{ inputs.job }}"); rm -rf "extra/${{ inputs.queue }}/$name"; mv "$d" "extra/${{ inputs.queue }}/$name"
          python3 tools/post_extra.py add "${{ inputs.queue }}" "extra/${{ inputs.queue }}/$name"
      - name: Add to the queue
        run: |
          git config user.name "queue bot" && git config user.email "queue-bot@users.noreply.github.com"
          git pull -q --rebase --autostash  # the carousel step above leaves queue/extra changes open
          for s in ${{ inputs.script }}; do
            f="${{ inputs.job }}/$s"
            out=$(jq -r '.output // "final_short.mp4"' "$f"); cap=$(jq -r '.caption // .title' "$f"); com=$(jq -r '.comment // ""' "$f")
            python3 tools/queue_post.py add "${{ inputs.queue }}" "${{ inputs.job }}/$out" "$cap" "$com"
          done
          git add queue extra && git commit -qm "Queue: add ${{ inputs.job }} to ${{ inputs.queue }}"
          # other builds and the daily run push too: rebase and try again instead of failing
          for i in 1 2 3 4 5; do git pull -q --rebase --autostash && git push -q && exit 0; sleep $((i * 7)); done; exit 1
