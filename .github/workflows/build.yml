name: Build video
run-name: Build ${{ inputs.job }}

# Start with: gh workflow run build.yml -f job=jobs/<name>
# autopilot.yml calls it too (workflow_call). An auto-* job has meta.json and no script.json:
# the script is written here (tools/autopilot/write_script.py) and committed back to the repo.
# A job folder holds script.json + source.json. Videos are never committed:
# the source is fetched here, and the result is a 1-day artifact.
on:
  workflow_dispatch:
    inputs:
      job:
        description: Job folder, e.g. jobs/death-note-e1
        required: true
      script:
        description: Script file(s) inside the job folder, space separated, built in order
        default: script.json
      queue:
        description: Page to queue the videos for (e.g. spoiler); empty = artifact only
        default: ''
      ref:
        description: Branch to check out (autopilot passes its branch, so the job folder it just pushed is there)
        default: ''
  workflow_call:
    inputs:
      job:
        type: string
        required: true
      script:
        type: string
        default: script.json
      queue:
        type: string
        default: ''
      ref:
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write   # the written script.json of an autopilot job is committed back
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Fetch private assets (music)
        env:
          ASSETS_KEY: ${{ secrets.ASSETS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$ASSETS_KEY" > ~/.ssh/assets && chmod 600 ~/.ssh/assets
          GIT_SSH_COMMAND="ssh -i ~/.ssh/assets -o StrictHostKeyChecking=accept-new" \
            git clone --depth 1 git@github.com:${{ github.repository_owner }}/recap-assets.git assets
          ln -s assets/music music

      # The film or panel video is kept between runs, so only the first build of a job downloads it.
      # Restored before WARP: through the tunnel the cache download crawls (6+ min instead of 20 s).
      - name: Restore cached source
        id: cache
        uses: actions/cache@v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 3
        with:
          path: |
            ${{ inputs.job }}/source.mp4
            ${{ inputs.job }}/work
          key: src-${{ inputs.job }}-${{ hashFiles(format('{0}/source.json', inputs.job)) }}

      - name: Read the source type
        id: src
        run: echo "type=$(jq -r .type '${{ inputs.job }}/source.json')" >> "$GITHUB_OUTPUT"

      # WARP is only needed to download a video source the cache did not have. Manga pages come without it:
      # a manga download through the tunnel twice cut the runner off from GitHub ("lost communication").
      - name: Route traffic through Cloudflare WARP
        if: steps.cache.outputs.cache-hit != 'true' && steps.src.outputs.type != 'manga' && steps.src.outputs.type != 'webtoon'
        timeout-minutes: 5
        uses: ./.github/actions/warp

      # Kokoro voice model (~330 MB): build_short.py downloads it on a miss, the cache keeps it
      - name: Restore voice model
        uses: actions/cache@v4
        with:
          path: voice-test/models
          key: kokoro-v1.0

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q uv kisskh-downloader playwright && python -m playwright install --with-deps chromium > /dev/null
          mkdir -p ~/.config/watch
          printf 'GROQ_API_KEY=%s\nHF_TOKEN=%s\n' "${{ secrets.GROQ_API_KEY }}" "${{ secrets.HF_TOKEN }}" > ~/.config/watch/.env

      - name: Fetch source
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: python3 tools/fetch_source.py "${{ inputs.job }}"

      # WARP is only for the download; the free edge voice service blocks its shared addresses
      - name: Leave WARP
        run: warp-cli --accept-tos disconnect || true

      - name: Write the script (autopilot jobs)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          job="${{ inputs.job }}"
          if [ -f "$job/meta.json" ] && [ ! -f "$job/script.json" ]; then
            python3 tools/autopilot/write_script.py "$job"
            git config user.name "queue bot" && git config user.email "queue-bot@users.noreply.github.com"
            git add "$job/script.json" && git commit -qm "Script: $job"
            git pull -q --rebase && git push -q
          fi

      - name: Build
        run: |
          for s in ${{ inputs.script }}; do
            [ -f "${{ inputs.job }}/$s" ] || { echo "no $s: prep run only"; continue; }
            uv run --python 3.11 --with truststore --with groq --with soundfile --with edge-tts --with numpy --with kokoro-onnx \
              --with gradio_client --with pillow python tools/build_short.py "${{ inputs.job }}" "$s"
          done

      # Every finished video is kept for good in the private assets repo, one release per series
      # (jobs/kdrama-weak-hero-e03 -> release archive-kdrama-weak-hero, file e03-final_short.mp4),
      # so whole-series compilations can be cut later without rebuilding.
      - name: Archive the videos
        if: always()
        env:
          GH_TOKEN: ${{ secrets.ARCHIVE_TOKEN }}
        run: |
          ls "${{ inputs.job }}"/final_*.mp4 >/dev/null 2>&1 || exit 0
          [ -n "$GH_TOKEN" ] || { echo "no ARCHIVE_TOKEN, skipped"; exit 0; }
          name=$(basename "${{ inputs.job }}"); series=$(echo "$name" | sed -E 's/-e[0-9]+$//'); ep=$(echo "$name" | grep -oE 'e[0-9]+$' || true)
          repo="${{ github.repository_owner }}/recap-assets"; tag="archive-$series"
          gh release view "$tag" -R "$repo" >/dev/null 2>&1 || gh release create "$tag" -R "$repo" --title "$tag" --notes "Finished recap videos for $series."
          for f in "${{ inputs.job }}"/final_*.mp4; do
            cp "$f" "/tmp/${ep:+$ep-}$(basename "$f")"; gh release upload "$tag" "/tmp/${ep:+$ep-}$(basename "$f")" -R "$repo" --clobber
          done

      - uses: actions/upload-artifact@v4
        if: always()  # keep the parts that did build
        with:
          name: video
          path: ${{ inputs.job }}/final_*.mp4
          if-no-files-found: ignore
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: sheets
          path: |
            ${{ inputs.job }}/work/panels_sheet_*.jpg
            ${{ inputs.job }}/work/film_sheet_*.jpg
            ${{ inputs.job }}/work/shot_sheet_*.jpg
            ${{ inputs.job }}/work/english.txt
            ${{ inputs.job }}/work/shots.txt
          if-no-files-found: ignore
          retention-days: 1

  # Puts the built videos into the page's posting queue, in script order.
  # Shares the post workflow's lock, so the queue file never gets two writers.
  queue:
    needs: build
    if: inputs.queue != ''
    runs-on: ubuntu-latest
    concurrency:
      group: post-${{ inputs.queue }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: video
          path: ${{ inputs.job }}
      # Autopilot videos have no human check, so a broken build must not reach the page
      - name: Check the video length (autopilot jobs)
        if: startsWith(inputs.job, 'jobs/auto-')
        run: |
          which ffprobe >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null; }
          for s in ${{ inputs.script }}; do
            out=$(jq -r '.output // "final_short.mp4"' "${{ inputs.job }}/$s")
            len=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "${{ inputs.job }}/$out")
            echo "$out: ${len}s"
            awk -v l="$len" 'BEGIN { exit !(l >= 120 && l <= 540) }' || { echo "length outside 120-540 s, not queued"; exit 1; }
          done
      - name: Add to the queue
        run: |
          git config user.name "queue bot" && git config user.email "queue-bot@users.noreply.github.com"
          git pull -q --rebase
          for s in ${{ inputs.script }}; do
            f="${{ inputs.job }}/$s"
            out=$(jq -r '.output // "final_short.mp4"' "$f"); cap=$(jq -r '.caption // .title' "$f"); com=$(jq -r '.comment // ""' "$f")
            python3 tools/queue_post.py add "${{ inputs.queue }}" "${{ inputs.job }}/$out" "$cap" "$com"
          done
          git add queue && git commit -qm "Queue: add ${{ inputs.job }} to ${{ inputs.queue }}" && git push -q
