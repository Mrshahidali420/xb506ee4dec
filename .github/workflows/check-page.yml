name: Check page token
run-name: Check ${{ inputs.page }} token

# Asks Facebook which page a saved token belongs to and whether it expires. Never prints the token.
on:
  workflow_dispatch:
    inputs:
      page:
        description: Secret prefix, e.g. ANIME, SPOILER, MANHWAX
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Facebook
        env:
          TOKEN: ${{ secrets[format('{0}_FB_PAGE_TOKEN', inputs.page)] }}
        run: |
          [ -n "$TOKEN" ] || { echo "the ${{ inputs.page }}_FB_PAGE_TOKEN secret is empty"; exit 1; }
          echo "token length: ${#TOKEN}"
          curl -s "https://graph.facebook.com/v21.0/me?fields=id,name" -H "Authorization: Bearer $TOKEN"; echo
          curl -s "https://graph.facebook.com/v21.0/debug_token?input_token=$TOKEN" -H "Authorization: Bearer $TOKEN" \
            | jq '{valid: .data.is_valid, type: .data.type, expires_at: .data.expires_at, scopes: .data.scopes, error: .error.message}'
