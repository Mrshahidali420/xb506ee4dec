name: Cut clips
run-name: Clips ${{ inputs.job }}

# Start with: gh workflow run clip.yml -f job=jobs/clip-<show>-e<N>
# The job folder holds source.json and clips.json (the writer's picks). The source comes from the
# build cache or is fetched again; clips are a 1-day artifact. Nothing is posted here.
on:
  workflow_dispatch:
    inputs:
      job:
        description: Job folder, e.g. jobs/clip-black-clover-s2-e06
        required: true
      publish:
        description: "true = also hand the clips to the Page posters (recap-assets release + manifest)"
        type: boolean
        default: false
      pick:
        description: "auto = pick the clips here with signals + Groq (no Claude), written to clips_auto.json; empty = cut the clips.json already in the job"
        default: ''

  workflow_call:
    inputs:
      job:
        type: string
        required: true
      pick:
        type: string
        default: ''
      ref:
        type: string
        default: ''
      publish:
        type: boolean
        default: false

jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Restore cached source
        id: cache
        uses: actions/cache@v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 3
        with:
          path: |
            ${{ inputs.job }}/source.mp4
            ${{ inputs.job }}/work
          key: src-${{ inputs.job }}-${{ hashFiles(format('{0}/source.json', inputs.job)) }}

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q uv

      - name: Fetch source (only on a cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: python3 tools/fetch_source.py "${{ inputs.job }}"

      - name: Pick the clips (signals + Groq, no Claude)
        if: inputs.pick == 'auto'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pip install -q numpy scipy librosa soundfile
          python3 tools/pick_clips.py "${{ inputs.job }}" clips_auto.json
          cat "${{ inputs.job }}/clips_auto.json"

      - name: Cut
        run: python3 tools/cut_clip.py "${{ inputs.job }}" ${{ inputs.pick == 'auto' && 'clips_auto.json' || 'clips.json' }}

      - name: Hand the clips to the Page posters
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.ARCHIVE_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "no ARCHIVE_TOKEN"; exit 1; }
          python3 tools/publish_clips.py "${{ inputs.job }}"

      - uses: actions/upload-artifact@v4
        with:
          name: clips
          path: |
            ${{ inputs.job }}/*_clip_*.mp4
            ${{ inputs.job }}/*_short_*.mp4
            ${{ inputs.job }}/clips_auto.json
            ${{ inputs.job }}/clips_out.json
          retention-days: 1
