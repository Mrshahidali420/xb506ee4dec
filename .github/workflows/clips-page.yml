name: Clips page (reusable)
run-name: Clips ${{ inputs.page }}

# One clip job for one Page that picks its own random good title (Anime Rewind, Manhwa X, Spoiler Room).
# Called by clips-animerewind.yml, clips-manhwax.yml, clips-spoiler.yml, each with its own concurrency group.
# tools/clip_daily.py pick <page> chooses the title, build.yml downloads it, clip.yml picks the hot stretch
# (signals + Groq) and hands the clip to recap-assets (manifest clips/<page>.json). Nothing is posted here:
# post-clips.yml posts.
on:
  workflow_call:
    inputs:
      page:
        type: string
        required: true
      retry:
        type: string
        default: '0'

jobs:
  pick:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      job: ${{ steps.pick.outputs.job }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick a title
        id: pick
        run: |
          out=$(python3 tools/clip_daily.py pick "${{ inputs.page }}")
          echo "$out"
          echo "$out" | grep '^job=' >> "$GITHUB_OUTPUT" || true
      - name: Commit the job folder
        if: steps.pick.outputs.job != ''
        run: |
          git config user.name "queue bot" && git config user.email "queue-bot@users.noreply.github.com"
          git add "${{ steps.pick.outputs.job }}"
          git commit -qm "Clips: ${{ inputs.page }} picks ${{ steps.pick.outputs.job }}"
          for i in 1 2 3 4 5; do git pull -q --no-rebase && git push -q && break; sleep $((RANDOM % 6 + 2)); [ $i = 5 ] && { echo "::error::push failed"; exit 1; }; done

  prep:
    needs: pick
    if: needs.pick.outputs.job != ''
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      job: ${{ needs.pick.outputs.job }}
      ref: ${{ github.ref_name }}
    secrets: inherit

  clip:
    needs: [pick, prep]
    uses: ./.github/workflows/clip.yml
    with:
      job: ${{ needs.pick.outputs.job }}
      pick: auto
      publish: true
      ref: ${{ github.ref_name }}
    secrets: inherit

  mark:
    needs: [pick, prep, clip]
    if: always() && needs.pick.outputs.job != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write   # starts this Page's run again when the source would not download
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Record the result
        id: mark
        run: |
          # prep failed = the source would not download (fetch_source.py says why): that title is dead, never picked again
          result=fail; [ "${{ needs.clip.result }}" = "success" ] && result=done; [ "${{ needs.prep.result }}" = "failure" ] && result=dead
          echo "result=$result" >> "$GITHUB_OUTPUT"
          python3 tools/clip_daily.py mark "${{ needs.pick.outputs.job }}" $result
          git config user.name "queue bot" && git config user.email "queue-bot@users.noreply.github.com"
          git add autopilot
          git diff --cached --quiet || git commit -qm "Clips: ${{ needs.pick.outputs.job }} $result"
          for i in 1 2 3 4 5; do git pull -q --no-rebase && git push -q && break; sleep $((RANDOM % 6 + 2)); [ $i = 5 ] && { echo "::error::push failed"; exit 1; }; done
      # A dead source must not cost the Page its hour: pick the next title now, at most twice in a row.
      - name: Try the next title
        if: steps.mark.outputs.result == 'dead' && fromJSON(inputs.retry) < 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "source dead, picking the next ${{ inputs.page }} title (retry $(( ${{ inputs.retry }} + 1 )) of 2)"
          gh workflow run "clips-${{ inputs.page }}.yml" --ref "${{ github.ref_name }}" -f retry=$(( ${{ inputs.retry }} + 1 ))
