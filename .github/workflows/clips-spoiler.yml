name: Clips Spoiler Room
run-name: Clips Spoiler Room

# One show-clip reel an hour for the Spoiler Room Page (clips-page.yml). Own concurrency group, so a slow job
# here never holds up the other Pages. Posting is post-clips.yml.
on:
  workflow_dispatch:
  schedule:
    - cron: '40 * * * *'

concurrency:
  group: clips-spoiler
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  clip:
    uses: ./.github/workflows/clips-page.yml
    with:
      page: spoiler
    secrets: inherit
