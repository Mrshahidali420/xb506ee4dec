name: Post to Instagram
run-name: Instagram ${{ inputs.page }} ${{ inputs.job }}

# Posts one archived video (recap-assets release) as a Reel on the page's linked Instagram account.
# Caption and comment come from the job's script.json.
on:
  workflow_dispatch:
    inputs:
      page:
        description: Page short name (spoiler, anime, manhwax)
        required: true
      job:
        description: Job folder, e.g. jobs/death-note-e2
        required: true
      tag:
        description: recap-assets release, e.g. archive-death-note
        required: true
      asset:
        description: File in that release, e.g. e2-final_short.mp4
        required: true

permissions:
  contents: write   # the video is staged on a public release of this repo for Instagram to fetch, then removed

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the video
        env:
          GH_TOKEN: ${{ secrets.ARCHIVE_TOKEN }}
        run: gh release download "${{ inputs.tag }}" -R "${{ github.repository_owner }}/recap-assets" -p "${{ inputs.asset }}" -O video.mp4
      - name: Stage the video on a public link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="ig-$(date +%s).mp4"; mv video.mp4 "$name"
          gh release view ig-staging >/dev/null 2>&1 || gh release create ig-staging --title ig-staging --notes "Videos waiting for Instagram to fetch them. Removed after posting."
          gh release upload ig-staging "$name"
          echo "STAGED=$name" >> "$GITHUB_ENV"
          link="https://github.com/${{ github.repository }}/releases/download/ig-staging/$name"
          echo "VIDEO_URL=$(curl -sLI -o /dev/null -w '%{url_effective}' "$link")" >> "$GITHUB_ENV"
      - name: Post the Reel
        env:
          PAGE_ID: ${{ secrets[format('{0}_FB_PAGE_ID', inputs.page)] }}
          PAGE_TOKEN: ${{ secrets[format('{0}_FB_PAGE_TOKEN', inputs.page)] }}
          PAGE: ${{ inputs.page }}
        run: |
          pip install -q requests truststore
          up=$(echo "$PAGE" | tr a-z A-Z)
          export "${up}_FB_PAGE_ID=$PAGE_ID" "${up}_FB_PAGE_TOKEN=$PAGE_TOKEN"
          f="${{ inputs.job }}/script.json"
          cap=$(jq -r '.caption // .title' "$f"); com=$(jq -r '.comment // ""' "$f")
          cd tools && python3 post_ig.py "$PAGE" "../$STAGED" "$cap" "$com" --go
      - name: Remove the staged video
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: '[ -z "$STAGED" ] || gh release delete-asset ig-staging "$STAGED" -y'
