name: Source probe
run-name: Probe ${{ inputs.title }}

# Checks what a GitHub machine can reach behind Cloudflare WARP:
# kisskh subtitles (+ the video when ticked), YouTube, and the edge-tts voice.
on:
  workflow_dispatch:
    inputs:
      title:
        description: Title or kisskh URL
        required: true
      video:
        description: Also download the video
        type: boolean
        default: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Route traffic through Cloudflare WARP
        timeout-minutes: 5
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp >/dev/null
          sleep 3
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect
          for i in $(seq 1 20); do warp-cli --accept-tos status | grep -q Connected && break; sleep 3; done
          warp-cli --accept-tos status
      - name: Install
        run: |
          curl -s https://www.cloudflare.com/cdn-cgi/trace | grep -E "^(ip|warp)="
          pip install -q -U kisskh-downloader playwright edge-tts yt-dlp
          python -m playwright install --with-deps chromium > /dev/null
      - name: Voice (edge-tts)
        continue-on-error: true
        run: edge-tts --voice en-US-GuyNeural --rate=+30% --pitch=+10Hz --text "This is a voice test from GitHub." --write-media v.mp3 && ls -la v.mp3
      - name: YouTube
        continue-on-error: true
        run: yt-dlp -q -f "b[height<=360]" --download-sections "*0-20" -o yt.mp4 "https://www.youtube.com/watch?v=u2Z2bIkVVkQ" && ls -la yt.mp4
      - name: Subtitles
        continue-on-error: true
        run: kisskh dl "${{ inputs.title }}" -f 1 -l 1 -s en -so -o out
      - name: Video
        if: inputs.video
        continue-on-error: true
        run: timeout 1500 kisskh dl "${{ inputs.title }}" -f 1 -l 1 -q 720p -o out
      - name: Report
        run: |
          find out -type f -exec ls -la {} \; 2>/dev/null | awk '{print $5, $NF}'
          f=$(find out -name "*.srt" 2>/dev/null | head -1); [ -n "$f" ] && head -30 "$f"
          v=$(find out -name "*.mp4" 2>/dev/null | head -1); [ -n "$v" ] && ffprobe -v error -show_entries format=duration:stream=width,height -of csv=p=0 "$v" || true
