name: Make thumbnail
run-name: Thumbnail ${{ inputs.meta }}${{ inputs.pick && format(' -> {0}', inputs.pick) || '' }}

# Makes the thumbnails for a manhwa part with tools/thumb_edit.py (real panels + HTML/CSS layers, no AI painting).
# tools/thumb_auto.py picks the panels by code (no tokens) when auto=true or the part has no thumb.json yet:
# auto-scene, auto-split, auto-trio, plus yt/panel-ranks.json (why each panel won). With a pick and a video id,
# it sets that one on YouTube.
on:
  workflow_dispatch:
    inputs:
      meta:
        description: Folder with thumb.json, e.g. jobs/manhwa-orv-p2/yt (the job folder is its parent)
        required: true
      auto:
        description: Also pick panels by code (thumb_auto.py) and make the auto-* thumbnails
        type: boolean
        default: true
      pick:
        description: Thumbnail to put on YouTube (scene, split, shock, auto-scene...); empty = only make them
        default: ''
      video:
        description: YouTube video id for the pick
        default: ''
      channel:
        description: Channel short name (login secret)
        default: manhwax

permissions:
  contents: write

jobs:
  thumb:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Find the job folder
        id: job
        run: echo "dir=$(dirname '${{ inputs.meta }}')" >> "$GITHUB_OUTPUT"
      # the part's panel video, kept by build.yml (same paths and key, or the cache does not match)
      - name: Restore the panel video
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.job.outputs.dir }}/source.mp4
            ${{ steps.job.outputs.dir }}/work
          key: src-${{ steps.job.outputs.dir }}-${{ hashFiles(format('{0}/source.json', steps.job.outputs.dir)) }}
          fail-on-cache-miss: false  # no panels: thumb_auto.py falls back to the AniList cover
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q "rembg[cpu]" pillow requests playwright opencv-python-headless numpy quickthumb google-api-python-client google-auth-oauthlib google-auth-httplib2
          # rembg pulls in its own OpenCV; one clean copy keeps cv2.CascadeClassifier (the anime face finder)
          pip uninstall -q -y opencv-python opencv-contrib-python opencv-python-headless opencv-contrib-python-headless || true
          pip install -q opencv-python-headless
          python3 -c "import cv2; print('opencv', cv2.__version__, hasattr(cv2, 'CascadeClassifier'))"
          python -m playwright install --with-deps chromium > /dev/null
      - name: Pick panels by code
        continue-on-error: true  # the hand-picked thumbnails below are made either way
        if: inputs.pick == '' && (inputs.auto || hashFiles(format('{0}/thumb.json', inputs.meta)) == '')
        run: |
          python3 tools/thumb_auto.py "${{ steps.job.outputs.dir }}" | tee auto.log
          grep -q '"review": true' "${{ inputs.meta }}/thumb-auto.json" && echo "### Low confidence: pick the panels by hand" >> "$GITHUB_STEP_SUMMARY" || true
          python3 tools/thumb_edit.py "${{ inputs.meta }}" thumb-auto.json
      - name: Make the thumbnails
        if: inputs.pick == '' && hashFiles(format('{0}/thumb.json', inputs.meta)) != ''
        run: python3 tools/thumb_edit.py "${{ inputs.meta }}"
      - uses: actions/upload-artifact@v4
        if: inputs.pick == ''
        with:
          name: thumbnails
          path: |
            ${{ steps.job.outputs.dir }}/thumb-*.jpg
            ${{ inputs.meta }}/panel-*.png
          retention-days: 7
      - name: Save them
        if: inputs.pick == ''
        run: |
          git config user.name "queue bot" && git config user.email "queue-bot@users.noreply.github.com"
          for f in "${{ steps.job.outputs.dir }}"/thumb-*.jpg "${{ inputs.meta }}"/thumb*.json "${{ inputs.meta }}"/panel-ranks.json; do [ -f "$f" ] && git add "$f"; done
          git commit -qm "Thumbnails: ${{ steps.job.outputs.dir }}" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
      - name: Set the pick on YouTube
        if: inputs.pick != '' && inputs.video != ''
        env:
          YT_TOKEN: ${{ secrets.YT_MANHWAX_TOKEN }}
          YT_CLIENT: ${{ secrets.YT_CLIENT_SECRET_JSON }}
        run: |
          mkdir -p ~/.config/watch
          printf '%s' "$YT_TOKEN" > ~/.config/watch/yt-${{ inputs.channel }}.json
          printf '%s' "$YT_CLIENT" > ~/.config/watch/yt_client_secret.json
          python3 tools/post_yt.py thumb "${{ inputs.channel }}" "${{ inputs.video }}" "${{ steps.job.outputs.dir }}/thumb-${{ inputs.pick }}.jpg"
