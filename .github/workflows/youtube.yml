name: Upload YouTube video
run-name: YouTube ${{ inputs.meta }}

# Joins the videos of finished build runs and uploads the result to YouTube (private unless public=true).
# Start with: gh workflow run youtube.yml -f runs="<id1> <id2>" -f meta=jobs/<name>-full
# meta folder: title.txt, description.txt ({chapters} is filled in), tags.txt, thumbnail.jpg, playlists.txt, parts.txt
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Build run IDs, space separated, in video order
        required: true
      meta:
        description: Folder in the repo with the title, description, tags, thumbnail, playlists and parts files
        required: true
      channel:
        description: Channel short name (login secret is kept as yt-<channel>.json)
        default: manhwax
      public:
        description: Ask for a public video (otherwise private)
        type: boolean
        default: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Download the part videos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          i=0
          for id in ${{ inputs.runs }}; do
            i=$((i + 1)); gh run download "$id" -n video -D "parts/$i"
            f=$(ls parts/$i/*.mp4 | head -1); echo "$f" >> parts.txt
          done
          cat parts.txt

      - name: Write the YouTube login
        env:
          TOKEN: ${{ secrets.YT_MANHWAX_TOKEN }}
          CLIENT: ${{ secrets.YT_CLIENT_SECRET_JSON }}
        run: |
          mkdir -p ~/.config/watch
          printf '%s' "$TOKEN" > ~/.config/watch/yt-${{ inputs.channel }}.json
          printf '%s' "$CLIENT" > ~/.config/watch/yt_client_secret.json

      - name: Join the parts
        run: python3 tools/join_parts.py "${{ inputs.meta }}" out $(cat parts.txt)

      - name: Upload
        run: |
          pip install -q google-api-python-client google-auth-oauthlib
          m="${{ inputs.meta }}"
          args=(); while IFS= read -r p; do [ -n "$p" ] && args+=(--playlist "$p"); done < "$m/playlists.txt"
          [ "${{ inputs.public }}" = "true" ] && args+=(--public)
          python3 tools/post_yt.py "${{ inputs.channel }}" out/joined.mp4 "$(cat "$m/title.txt")" "@out/description.txt" \
            --tags "$(cat "$m/tags.txt")" --thumb "$m/thumbnail.jpg" "${args[@]}" --go
